[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-typesetter"
version = "0.4.0"
description = "A document-first classical Chinese typesetting engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "fonttools>=4.50,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
browser = ["playwright>=1.40,<2"]

[project.scripts]
bamboo = "bamboo.cli:main"

[tool.setuptools.packages.find]
include = ["bamboo*"]

[tool.setuptools.package-data]
bamboo = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
