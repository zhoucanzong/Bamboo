[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-typesetter"
version = "0.7.0"
description = "An editable Chinese books and traditional-document typesetting engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "zhoucanzong"}]
requires-python = ">=3.9"
dependencies = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "fonttools>=4.50,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
browser = ["playwright>=1.40,<2"]

[project.scripts]
bamboo = "bamboo.cli:main"

[tool.setuptools.packages.find]
include = ["bamboo*"]

[tool.setuptools.package-data]
bamboo = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
